name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cloudvitta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Lint & Format Check
        run: task lint

      - name: Verify Swagger Docs Freshness
        run: |
          task swagger --force
          git diff --exit-code internal/transport/rest/openapi/

      - name: Cache Tern
        id: cache-tern
        uses: actions/cache@v4
        with:
          path: ~/go/bin/tern
          key: ${{ runner.os }}-tern-v2

      - name: Install Tern
        if: steps.cache-tern.outputs.cache-hit != 'true'
        run: go install github.com/jackc/tern/v2@latest

      - name: Run Database Migrations (Tern)
        env:
          # Use standard Postgres environment variables for Tern
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: cloudvitta_test
          PGUSER: user
          PGPASSWORD: password
        run: |
          cd migrations
          # We echo a minimal tern config to ensure it reads from env vars
          echo "[database]" > tern.conf
          tern migrate

      - name: Run Tests
        env:
          TEST_DB_URL: postgres://user:password@localhost:5432/cloudvitta_test?sslmode=disable
        run: task test -- -v

      - name: Build All Targets
        run: task build

  web-ci:
    name: Frontend Lint, Typecheck, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Typecheck Frontend
        run: npm run typecheck

      - name: Build Frontend
        run: npm run build

