name: CD - Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'asia-southeast1' }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION || secrets.GAR_LOCATION || vars.GCP_REGION || secrets.GCP_REGION || 'asia-southeast1' }}
  GAR_REPO: ${{ vars.GAR_REPO || secrets.GAR_REPO || 'cloudvitta-repo' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || secrets.SERVICE_NAME || 'cloudvitta-api' }}

jobs:
  deploy:
    name: Build, Migrate, and Deploy
    runs-on: ubuntu-latest
    
    # These permissions are required for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id || secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go (for Tern)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Tern
        id: cache-tern
        uses: actions/cache@v4
        with:
          path: ~/go/bin/tern
          key: ${{ runner.os }}-tern-v2

      - name: Install Tern
        if: steps.cache-tern.outputs.cache-hit != 'true'
        run: go install github.com/jackc/tern/v2@latest

      - name: Run Production Database Migrations
        run: |
          cd migrations
          # We create a temporary tern.conf using Go template syntax for env var interpolation
          echo '[database]' > tern.conf
          echo 'conn_string = {{env "DATABASE_URL"}}' >> tern.conf
          DATABASE_URL="${{ secrets.NEON_PROD_DSN }}" tern migrate

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id || secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            DATABASE_URL=${{ secrets.NEON_PROD_DSN }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            CLOUDVITTA_STORAGE_GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME || secrets.GCS_BUCKET_NAME || 'cloudvitta-raw-fixtures' }}
            CLOUDVITTA_PRIMARY_ENVIRONMENT=production
            CLOUDVITTA_PRIMARY_LOG_LEVEL=info
            CLOUDVITTA_AUTH_JWT_SECRET=${{ secrets.CLOUDVITTA_AUTH_JWT_SECRET || secrets.JWT_SECRET }}
            CLOUDVITTA_AUTH_ANON_COOKIE_SECRET=${{ secrets.CLOUDVITTA_AUTH_ANON_COOKIE_SECRET || secrets.ANON_COOKIE_SECRET || secrets.CLOUDVITTA_AUTH_JWT_SECRET || secrets.JWT_SECRET }}
            CLOUDVITTA_GCP_API_KEY=${{ secrets.CLOUDVITTA_GCP_API_KEY || secrets.GCP_API_KEY || '' }}
            CLOUDVITTA_IBM_API_KEY=${{ secrets.CLOUDVITTA_IBM_API_KEY || secrets.IBM_API_KEY || '' }}
            CLOUDVITTA_ALIBABA_ACCESS_KEY_ID=${{ secrets.CLOUDVITTA_ALIBABA_ACCESS_KEY_ID || secrets.ALIBABA_ACCESS_KEY_ID || '' }}
            CLOUDVITTA_ALIBABA_ACCESS_KEY_SECRET=${{ secrets.CLOUDVITTA_ALIBABA_ACCESS_KEY_SECRET || secrets.ALIBABA_ACCESS_KEY_SECRET || '' }}
            CLOUDVITTA_DIGITALOCEAN_TOKEN=${{ secrets.CLOUDVITTA_DIGITALOCEAN_TOKEN || secrets.DIGITALOCEAN_TOKEN || '' }}
            CLOUDVITTA_CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS || secrets.CORS_ALLOWED_ORIGINS || 'https://cloudvitta.dev' }}
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.GRAFANA_OTLP_ENDPOINT || vars.GRAFANA_OTLP_ENDPOINT || secrets.OTEL_EXPORTER_OTLP_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
            OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.GRAFANA_OTLP_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
