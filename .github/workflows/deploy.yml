name: CD - Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'asia-southeast1' }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION || secrets.GAR_LOCATION || vars.GCP_REGION || secrets.GCP_REGION || 'asia-southeast1' }}
  GAR_REPO: ${{ vars.GAR_REPO || secrets.GAR_REPO || 'cloudvitta-repo' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || secrets.SERVICE_NAME || 'cloudvitta-api' }}

jobs:
  deploy:
    name: Build, Migrate, and Deploy
    runs-on: ubuntu-latest
    
    # These permissions are required for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        env:
          IMAGE_NAME: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id || secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Set up Go (for Tern)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install Tern
        run: go install github.com/jackc/tern/v2@latest

      - name: Run Production Database Migrations
        run: |
          cd migrations
          # We create a temporary tern.conf to use the connection string from the secret
          echo "[database]" > tern.conf
          echo "conn_string = env.DATABASE_URL" >> tern.conf
          DATABASE_URL="${{ secrets.NEON_PROD_DSN }}" tern migrate

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            DATABASE_URL=${{ secrets.NEON_PROD_DSN }}
            REDIS_URL=${{ secrets.REDIS_URL }}
