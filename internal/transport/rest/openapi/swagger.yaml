definitions:
  domain.ComputeAttributes:
    properties:
      family:
        type: string
      ram_gb:
        type: number
      vcpu:
        type: number
    type: object
  middleware.RFC7807Error:
    properties:
      detail:
        type: string
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  rest.ComputeComparisonMeta:
    properties:
      api_version:
        type: string
      generated_at:
        type: string
      query:
        additionalProperties: true
        type: object
    type: object
  rest.ComputeComparisonResponse:
    properties:
      meta:
        $ref: '#/definitions/rest.ComputeComparisonMeta'
      results:
        items:
          $ref: '#/definitions/rest.ComputeResultEntry'
        type: array
      warnings:
        items:
          $ref: '#/definitions/rest.ProviderWarning'
        type: array
    type: object
  rest.ComputeResultEntry:
    properties:
      fetched_at:
        type: string
      match_delta_pct:
        type: number
      match_quality:
        type: string
      matched_spec:
        $ref: '#/definitions/domain.ComputeAttributes'
      missing_attributes:
        items:
          type: string
        type: array
      normalized_hourly_usd:
        type: number
      price:
        $ref: '#/definitions/rest.PriceDetail'
      provider:
        type: string
      sku_id:
        type: string
      stale:
        type: boolean
    type: object
  rest.PriceDetail:
    properties:
      amount:
        type: number
      currency:
        type: string
      unit:
        type: string
    type: object
  rest.ProviderWarning:
    properties:
      code:
        type: string
      message:
        type: string
      provider:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/prices/compute:
    get:
      description: Returns normalized compute pricing across cloud providers for requested
        specs.
      parameters:
      - description: Requested vCPU count (e.g. 4)
        in: query
        name: vcpu
        type: number
      - description: Requested RAM in GB (e.g. 16)
        in: query
        name: ram_gb
        type: number
      - description: 'Canonical region group (default: us-east)'
        in: query
        name: region
        type: string
      - description: 'Target currency code (default: USD)'
        in: query
        name: currency
        type: string
      - description: Strict instance family matching
        in: query
        name: strict_family
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.ComputeComparisonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
      summary: Get compute pricing comparison
      tags:
      - prices
swagger: "2.0"
