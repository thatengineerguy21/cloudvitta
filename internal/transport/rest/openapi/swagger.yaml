definitions:
  domain.ComputeAttributes:
    properties:
      family:
        type: string
      ram_gb:
        type: number
      vcpu:
        type: number
    type: object
  domain.NetworkAttributes:
    properties:
      egress_gb:
        type: number
      transfer_type:
        type: string
    type: object
  domain.StorageAttributes:
    properties:
      iops:
        description: |-
          IOPS holds provisioned IOPS where reported (e.g. block storage EBS gp3/io2).
          Currently unpopulated for S3/Blob/GCS object storage in stage 1.4.
        type: integer
      size_gb:
        type: number
      storage_class:
        type: string
    type: object
  middleware.RFC7807Error:
    properties:
      detail:
        type: string
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  rest.CalculateComparisonMeta:
    properties:
      api_version:
        type: string
      generated_at:
        type: string
    type: object
  rest.CalculateComparisonResponse:
    properties:
      meta:
        $ref: '#/definitions/rest.CalculateComparisonMeta'
      results:
        items:
          $ref: '#/definitions/service.CalculateProviderResult'
        type: array
      warnings:
        items:
          $ref: '#/definitions/rest.ProviderWarning'
        type: array
    type: object
  rest.CalculateComputeRequest:
    properties:
      family:
        type: string
      ram_gb:
        type: number
      strict_family:
        type: boolean
      vcpu:
        type: number
    type: object
  rest.CalculateNetworkRequest:
    properties:
      egress_gb:
        type: number
      transfer_type:
        type: string
    type: object
  rest.CalculateRequestBody:
    properties:
      compute:
        $ref: '#/definitions/rest.CalculateComputeRequest'
      currency:
        type: string
      network:
        $ref: '#/definitions/rest.CalculateNetworkRequest'
      region:
        type: string
      storage:
        $ref: '#/definitions/rest.CalculateStorageRequest'
    type: object
  rest.CalculateStorageRequest:
    properties:
      size_gb:
        type: number
      storage_class:
        type: string
    type: object
  rest.ComputeComparisonMeta:
    properties:
      api_version:
        type: string
      generated_at:
        type: string
      query:
        additionalProperties: true
        type: object
    type: object
  rest.ComputeComparisonResponse:
    properties:
      meta:
        $ref: '#/definitions/rest.ComputeComparisonMeta'
      results:
        items:
          $ref: '#/definitions/rest.ComputeResultEntry'
        type: array
      warnings:
        items:
          $ref: '#/definitions/rest.ProviderWarning'
        type: array
    type: object
  rest.ComputeResultEntry:
    properties:
      fetched_at:
        type: string
      match_delta_pct:
        type: number
      match_quality:
        type: string
      matched_spec:
        $ref: '#/definitions/domain.ComputeAttributes'
      missing_attributes:
        items:
          type: string
        type: array
      normalized_hourly_usd:
        type: number
      price:
        $ref: '#/definitions/rest.PriceDetail'
      provider:
        type: string
      sku_id:
        type: string
      stale:
        type: boolean
    type: object
  rest.NetworkComparisonMeta:
    properties:
      api_version:
        type: string
      generated_at:
        type: string
      query:
        additionalProperties: true
        type: object
    type: object
  rest.NetworkComparisonResponse:
    properties:
      meta:
        $ref: '#/definitions/rest.NetworkComparisonMeta'
      results:
        items:
          $ref: '#/definitions/rest.NetworkResultEntry'
        type: array
      warnings:
        items:
          $ref: '#/definitions/rest.ProviderWarning'
        type: array
    type: object
  rest.NetworkResultEntry:
    properties:
      fetched_at:
        type: string
      match_delta_pct:
        type: number
      match_quality:
        type: string
      matched_spec:
        $ref: '#/definitions/domain.NetworkAttributes'
      missing_attributes:
        items:
          type: string
        type: array
      monthly_cost_usd:
        type: number
      price:
        $ref: '#/definitions/rest.PriceDetail'
      provider:
        type: string
      sku_id:
        type: string
      stale:
        type: boolean
    type: object
  rest.PriceDetail:
    properties:
      amount:
        type: number
      currency:
        type: string
      unit:
        type: string
    type: object
  rest.ProviderWarning:
    properties:
      code:
        type: string
      message:
        type: string
      provider:
        type: string
    type: object
  rest.StorageComparisonMeta:
    properties:
      api_version:
        type: string
      generated_at:
        type: string
      query:
        additionalProperties: true
        type: object
    type: object
  rest.StorageComparisonResponse:
    properties:
      meta:
        $ref: '#/definitions/rest.StorageComparisonMeta'
      results:
        items:
          $ref: '#/definitions/rest.StorageResultEntry'
        type: array
      warnings:
        items:
          $ref: '#/definitions/rest.ProviderWarning'
        type: array
    type: object
  rest.StorageResultEntry:
    properties:
      fetched_at:
        type: string
      match_delta_pct:
        type: number
      match_quality:
        type: string
      matched_spec:
        $ref: '#/definitions/domain.StorageAttributes'
      missing_attributes:
        items:
          type: string
        type: array
      monthly_cost_usd:
        type: number
      price:
        $ref: '#/definitions/rest.PriceDetail'
      provider:
        type: string
      sku_id:
        type: string
      stale:
        type: boolean
    type: object
  service.CalculateCategoryResult:
    properties:
      match_quality:
        type: string
      normalized_hourly_usd:
        type: number
      sku_id:
        type: string
    type: object
  service.CalculateProviderResult:
    properties:
      categories:
        additionalProperties:
          $ref: '#/definitions/service.CalculateCategoryResult'
        type: object
      partial:
        type: boolean
      partial_total_normalized_hourly_usd:
        type: number
      provider:
        type: string
      total_normalized_hourly_usd:
        type: number
    type: object
info:
  contact: {}
paths:
  /api/v1/calculate:
    post:
      consumes:
      - application/json
      description: Calculates server-side composite normalized hourly pricing across
        cloud providers (AWS, Azure, GCP) for multi-category workloads (compute, storage,
        network).
      parameters:
      - description: Workload calculation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.CalculateRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.CalculateComparisonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
      summary: Calculate composite workload pricing
      tags:
      - prices
  /api/v1/prices/compute:
    get:
      description: Returns normalized compute pricing across cloud providers for requested
        specs.
      parameters:
      - description: Requested vCPU count (e.g. 4)
        in: query
        name: vcpu
        type: number
      - description: Requested RAM in GB (e.g. 16)
        in: query
        name: ram_gb
        type: number
      - description: Instance family filter (e.g. t3, c5)
        in: query
        name: family
        type: string
      - description: 'Canonical region group (default: us-east)'
        in: query
        name: region
        type: string
      - description: 'Target currency code (default: USD)'
        in: query
        name: currency
        type: string
      - description: 'Strict instance family matching (default: true)'
        in: query
        name: strict_family
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.ComputeComparisonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
      summary: Get compute pricing comparison
      tags:
      - prices
  /api/v1/prices/network:
    get:
      description: Returns normalized network / data transfer egress pricing across
        cloud providers (AWS, Azure, GCP) for requested specs.
      parameters:
      - description: Requested network egress in GB (e.g. 500, max 10000000)
        in: query
        name: egress_gb
        type: string
      - description: Canonical transfer type (intra_region, inter_region, internet_egress)
        in: query
        name: transfer_type
        type: string
      - description: 'Canonical region group (default: us-east)'
        in: query
        name: region
        type: string
      - description: 'Target currency code (default: USD)'
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.NetworkComparisonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
      summary: Get network pricing comparison
      tags:
      - prices
  /api/v1/prices/storage:
    get:
      description: Returns normalized storage pricing across cloud providers (AWS,
        Azure, GCP) for requested specs.
      parameters:
      - description: Requested storage size in GB (e.g. 500, max 1000000)
        in: query
        name: size_gb
        type: string
      - description: Requested canonical storage class (e.g. standard, infrequent_access,
          archive)
        in: query
        name: storage_class
        type: string
      - description: 'Canonical region group (default: us-east)'
        in: query
        name: region
        type: string
      - description: 'Target currency code (default: USD)'
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.StorageComparisonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RFC7807Error'
      summary: Get storage pricing comparison
      tags:
      - prices
swagger: "2.0"
