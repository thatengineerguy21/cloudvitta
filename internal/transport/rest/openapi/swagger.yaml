definitions:
  github_com_thatengineerguy21_CloudVitta_internal_domain.ClusterTopology:
    enum:
    - zonal
    - regional
    - autopilot
    type: string
    x-enum-varnames:
    - ClusterTopologyZonal
    - ClusterTopologyRegional
    - ClusterTopologyAutopilot
  github_com_thatengineerguy21_CloudVitta_internal_domain.ComputeAttributes:
    properties:
      family:
        type: string
      ram_gb:
        type: number
      vcpu:
        type: number
    type: object
  github_com_thatengineerguy21_CloudVitta_internal_domain.DatabaseNoSQLAttributes:
    properties:
      component_type:
        description: '"throughput", "storage", "request_operations"'
        type: string
      data_model:
        description: '"document", "key_value", "wide_column", "graph", "multi_model"'
        type: string
      multi_region:
        description: Multi-region replication / global distribution
        type: boolean
      pricing_mode:
        description: '"provisioned", "on_demand", "serverless"'
        type: string
      read_units:
        description: Provisioned reads/sec (RCU/RU/s) or request rate
        type: number
      replication_zones:
        description: 'Number of replica regions (default: 1)'
        type: integer
      storage_class:
        description: '"standard", "infrequent_access", "analytical"'
        type: string
      storage_gb:
        description: Storage capacity in GiB
        type: number
      write_units:
        description: Provisioned writes/sec (WCU/RU/s) or request rate
        type: number
    type: object
  github_com_thatengineerguy21_CloudVitta_internal_domain.DatabaseRDBMSAttributes:
    properties:
      component_type:
        description: '"instance" or "storage"'
        type: string
      deployment_tier:
        description: '"standard", "flexible", "burstable", "aurora"'
        type: string
      engine:
        description: '"postgresql", "mysql", "sqlserver", "mariadb", "oracle"'
        type: string
      iops:
        description: Provisioned IOPS
        type: integer
      multi_az:
        description: High Availability deployment
        type: boolean
      ram_gb:
        description: Memory capacity in GiB (0 for pure storage rows)
        type: number
      storage_family:
        description: '"gp3", "gp2", "io1", "ssd", "hdd"'
        type: string
      storage_gb:
        description: Storage capacity in GiB (0 for pure instance rows)
        type: number
      vcpu:
        description: Number of vCPUs (0 for pure storage rows)
        type: number
    type: object
  github_com_thatengineerguy21_CloudVitta_internal_domain.KubernetesAttributes:
    properties:
      cluster_topology:
        allOf:
        - $ref: '#/definitions/github_com_thatengineerguy21_CloudVitta_internal_domain.ClusterTopology'
        description: '"zonal", "regional", "autopilot" — GCP-specific'
      tier:
        allOf:
        - $ref: '#/definitions/github_com_thatengineerguy21_CloudVitta_internal_domain.KubernetesTier'
        description: '"free", "standard", "extended_support"'
    type: object
  github_com_thatengineerguy21_CloudVitta_internal_domain.KubernetesTier:
    enum:
